# Save as compose.yaml. Set the public URL to the address used in your browser.
services:
  reelscarey:
    image: faaaaq/reelscarey:latest
    pull_policy: always
    container_name: reelscarey
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
      REELSCAREY_PUBLIC_URL: https://reelscarey.example.com
      REELSCAREY_CONFIG_DIR: /config/state
      REELSCAREY_MEDIA_DIR: /data
      # Separate mounts and the read-only /downloads mount force verified
      # copies. For hardlink imports, use one writable parent mount containing
      # both folders and set these to that parent's media/download subfolders,
      # for example REELSCAREY_MEDIA_DIR=/data/media and
      # REELSCAREY_DOWNLOADS_DIR=/data/downloads. Setup asks for the method.
    volumes:
      - "/home/faaaaq/configs/reelscarey/config:/config"
      # Read-only to protect seeding/usenet sources.
      - "/home/faaaaq/massstorage/PlexDL:/downloads:ro"
      - "library-state:/data"
      - "/mnt/masstorage/Anime:/data/anime"
      - "/mnt/masstorage/TV:/data/tvshows"
      # Optional existing music library for Music -> Library Import.
      # - "/mnt/masstorage/Music:/data/Music"
    networks:
      - npm
    restart: unless-stopped

volumes:
  library-state:

networks:
  npm:
    external: true
