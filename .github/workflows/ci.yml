name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci && npm run format:check && npm run check && npm test && npm run build
        working-directory: web
      - run: go test -race ./...
      - run: go vet ./...
      - name: Install disposable qBittorrent and video test tools
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends qbittorrent-nox ffmpeg
      - name: Real qBittorrent movie and TV downloads and safe imports
        run: go test -race ./internal/transfer -run TestRealQBittorrent -count=1 -v -timeout=8m
        env:
          REELSCAREY_LIVE_QBT: '1'
      - run: go build -o bin/reelscarey ./cmd/reelscarey
      - run: node scripts/smoke.mjs
      - name: Build and smoke-test the container
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker build -t reelscarey:ci .
          docker run -d --name reelscarey-ci -p 127.0.0.1:8787:8787 reelscarey:ci
          trap 'docker logs reelscarey-ci; docker rm -fv reelscarey-ci' EXIT
          node scripts/container-smoke.mjs
