name: Application checks
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast checks run on every branch push and pull request. The publish
  # workflow builds the same Dockerfile and runs the release-candidate smoke
  # scripts, so tag pushes do not need this job.
  test:
    # Pull requests can come from forks, so they never run on a self-hosted
    # machine. Push/schedule/dispatch jobs use the configured runner label;
    # the default stays the existing self-hosted Linux x64 runner.
    runs-on: ${{ (github.event_name == 'pull_request' && 'ubuntu-latest') || vars.REELSCAREY_RUNNER || 'reelscarey-ci' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci && npm run format:check && npm run check && npm test && npm run build
        working-directory: web
      - run: go test ./...
      - name: Go formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Cross-filesystem folder move and recovery
        run: |
          fixture="$RUNNER_TEMP/reelscarey-cross-fixture"
          mkdir -p "$fixture/media/Anime"
          sudo mount -t tmpfs -o "uid=$(id -u),gid=$(id -g),size=32m" tmpfs "$fixture/media/Anime"
          trap 'sudo umount "$fixture/media/Anime"' EXIT
          REELSCAREY_TEST_CROSS_ROOT="$fixture" go test -race ./internal/organization -run '^TestCrossFilesystemFolderMove$' -count=1 -v -timeout=3m
      - name: Race-enabled concurrency suite
        # Fast-CI race coverage beyond the single cross-filesystem move above,
        # bounded to the most concurrency-sensitive code: revision-fenced
        # organization reviews, metadata provider clients, the database WAL
        # pool under sustained load, and transfer lease/claim/reservation
        # fences. The full -race suite stays nightly-only (acceptance job).
        # organization + metadata under -race measured 600s+ on the
        # self-hosted runner (runs 43513383237 and 43565762772 both hit the
        # former 10m test alarm mid-package with no failure and no race), so
        # the first command gets a 30m bound; the job timeout rises to 45m to
        # match. The tests themselves are unchanged.
        run: |
          go test -race ./internal/organization ./internal/metadata -count=1 -timeout=30m
          go test -race ./internal/database -run '^TestWALStaysBoundedUnderSustainedLoad$' -count=1 -timeout=10m
          go test -race ./internal/transfer -run 'TestLeaseExpiryRefusesTorrentWrites|TestLeaseExpiryRefusesMusicWrites|TestLeaseFencesStaleWorker|TestTVReservationsSkipAndDuplicateProtection|TestTVActiveReservationsAndCancelledResumeConflicts|TestQueueManualTorrentTargetsMovieAndDeduplicatesByHash|TestMusicSubmissionIsReservedBeforeClientAndSurvivesCancellation|TestMatchingQueueDoesNotWaitForDiskInspection|TestQBittorrentLoginsDoNotSerializeAcrossClients' -count=1 -timeout=10m
      - run: go vet ./...
      - name: Known dependency vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          npm audit --audit-level=high --prefix web
      - run: go build -o bin/reelscarey ./cmd/reelscarey
      - run: node scripts/smoke.mjs

  # Live acceptance is intentionally out of the push/PR path: it starts
  # disposable qBittorrent, SABnzbd and NZBGet runtimes, generates media, and
  # builds/smokes containers. It runs nightly and on manual dispatch. Run it
  # before a release with `gh workflow run ci.yml`; the publish workflow also
  # runs its release-candidate smoke scripts before pushing.
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    # Only manual dispatch and the nightly schedule reach this job, so it may
    # use a self-hosted runner. Point REELSCAREY_ACCEPTANCE_RUNNER (or
    # REELSCAREY_RUNNER) at a second machine to stop releases queueing behind
    # a long acceptance run.
    runs-on: ${{ vars.REELSCAREY_ACCEPTANCE_RUNNER || vars.REELSCAREY_RUNNER || 'reelscarey-ci' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the embedded frontend
        # web/embed.go declares //go:embed all:dist and web/dist/ is
        # gitignored, so every Go compile in this job fails with
        # "pattern all:dist: no matching files found" until the frontend is
        # built (observed on run 42449545070).
        run: npm ci && npm run build
        working-directory: web
      - name: Race-enabled full test suite
        # Explicit timeout instead of the 10m per-package default: on this
        # runner the much smaller race subset (internal/organization +
        # internal/metadata, ~40s without -race) already exceeded 10m under
        # -race (run 43513383237), because race instrumentation multiplies
        # the cost of the pure-Go modernc.org/sqlite driver and the
        # first-time race build of that dependency chain. The full suite is
        # 3m04s without -race here, so 60m bounds the extrapolated
        # 20-60m race runtime without silently hiding a hang: per-test
        # timings show no single pathological test (max 1.5s without -race).
        run: go test -race ./... -timeout=60m
      - name: Public AniList identity and title-search acceptance
        run: go test -race ./internal/metadata -run TestLiveAniListIdentity -count=1 -v -timeout=30s
        env:
          REELSCAREY_LIVE_ANILIST: '1'
      - name: Public Kitsu identity and title-search acceptance
        run: go test -race ./internal/metadata -run TestLiveKitsuIdentity -count=1 -v -timeout=30s
        env:
          REELSCAREY_LIVE_KITSU: '1'
      - name: Install disposable download clients and media test tools
        timeout-minutes: 20
        run: |
          # The hosted runner's Azure mirror can throttle these media packages.
          # Use Ubuntu's primary HTTPS archive; APT signature checks stay enabled.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends qbittorrent-nox ffmpeg par2 unrar
      - name: Real qBittorrent movie and TV downloads and safe imports
        run: go test -race ./internal/transfer -run TestRealQBittorrent -count=1 -v -timeout=8m
        env:
          REELSCAREY_LIVE_QBT: '1'
      - name: Real built-in qBittorrent supervision
        run: go test -race ./internal/transfer -run TestRealBundledClientLifecycle -count=1 -v -timeout=5m
        env:
          REELSCAREY_LIVE_BUNDLED: '1'
      - name: Real Transmission movie and reviewed TV imports
        run: |
          docker buildx build --load -f scripts/transmission-test.Dockerfile -t reelscarey:transmission-test \
            --cache-from type=gha,scope=reelscarey-transmission \
            --cache-to type=gha,mode=max,scope=reelscarey-transmission,ignore-error=true .
          docker run --rm reelscarey:transmission-test
      - name: Generated subtitle media and embedded track detection
        run: go test -race ./internal/subtitle -run 'TestRealSubtitle(Media|OriginalFormats|SubDLFormats)' -count=1 -v -timeout=3m
        env:
          REELSCAREY_LIVE_SUBTITLES: '1'
      - name: Automatic Anime matching and reviewed real-client import
        run: go test -race ./internal/automation -run TestRealAnime -count=1 -v -timeout=4m
        env:
          REELSCAREY_LIVE_ANIME: '1'
      - name: Existing library discovery and verified in-place registration
        run: go test -race ./internal/transfer -run 'TestRealExistingLibraryMedia|TestFFprobeSeeksOverLargeMP4Payload' -count=1 -v -timeout=2m
        env:
          REELSCAREY_LIVE_EXISTING: '1'
      - name: Generated Anime media organization and subtitle preservation
        run: go test -race ./internal/organization -run TestRealOrganization -count=1 -v -timeout=2m
        env:
          REELSCAREY_LIVE_ORGANIZATION: '1'
      - name: Generated metadata updates and in-place title verification
        run: go test -race ./internal/organization -run 'TestLive(EmbeddedTitleReplacesInPlace|HDRTitleRewritePreservesTransfer|OrganizationUpdatesEmbeddedTitle|SeriesOrganizationUpdatesEmbeddedTitle)' -count=1 -v -timeout=5m
        env:
          REELSCAREY_LIVE_REPLACEMENT: '1'
      - name: Reviewed YouTube video and subtitle import with generated media
        run: go test -race ./internal/youtube -run TestRealYouTubeGeneratedFixture -count=1 -v -timeout=2m
        env:
          REELSCAREY_LIVE_YOUTUBE_FIXTURE: '1'
      - name: Install isolated SABnzbd test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/reelscarey-sab"
          curl --fail --location --retry 2 https://github.com/sabnzbd/sabnzbd/releases/download/5.1.3/SABnzbd-5.1.3-src.tar.gz -o "$RUNNER_TEMP/reelscarey-sab/source.tar.gz"
          printf '%s  %s\n' '12a01e30ce166297a375ffc3a761f98bf7d93260e040391497f643f8a3525fed' "$RUNNER_TEMP/reelscarey-sab/source.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/reelscarey-sab/source.tar.gz" -C "$RUNNER_TEMP/reelscarey-sab"
          python3 -m venv "$RUNNER_TEMP/reelscarey-sab-env"
          "$RUNNER_TEMP/reelscarey-sab-env/bin/pip" install -r "$RUNNER_TEMP/reelscarey-sab/SABnzbd-5.1.3/requirements.txt"
      - name: Real SABnzbd generated movie and reviewed TV imports
        run: |
          export REELSCAREY_SABNZBD="$RUNNER_TEMP/reelscarey-sab/SABnzbd-5.1.3/SABnzbd.py"
          export REELSCAREY_SABNZBD_PYTHON="$RUNNER_TEMP/reelscarey-sab-env/bin/python"
          go test -race ./internal/transfer -run TestRealSABnzbd -count=1 -v -timeout=5m
        env:
          REELSCAREY_LIVE_SAB: '1'
      - name: Install isolated NZBGet test runtime
        run: |
          curl --fail --location --retry 2 https://github.com/nzbgetcom/nzbget/releases/download/v26.3/nzbget-26.3-bin-linux.run -o "$RUNNER_TEMP/nzbget.run"
          printf '%s  %s\n' '6a7f0519cf7deeb59cc1457c87d6efc7f28ef3dd17ed5ddc3be6a698a6093391' "$RUNNER_TEMP/nzbget.run" | sha256sum --check
          sh "$RUNNER_TEMP/nzbget.run" --unpack --destdir "$RUNNER_TEMP/reelscarey-nzbget"
      - name: Real NZBGet named client movie and reviewed TV imports
        run: |
          export REELSCAREY_NZBGET="$RUNNER_TEMP/reelscarey-nzbget/nzbget-x86_64"
          go test -race ./internal/transfer -run TestRealNZBGet -count=1 -v -timeout=4m
        env:
          REELSCAREY_LIVE_NZBGET: '1'
      - name: Build the container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: reelscarey:ci
          # The acceptance job already ran the race suite natively, so this
          # build keeps the Dockerfile default (RUN_GO_TESTS=1) as an
          # independent check of the image; the persistent cache only avoids
          # re-downloading base layers and rebuilding unchanged stages.
          cache-from: type=gha,scope=reelscarey-ci
          cache-to: type=gha,mode=max,scope=reelscarey-ci,ignore-error=true
          provenance: false
          sbom: false
      - name: Build and smoke-test the container
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker run -d --name reelscarey-ci --user 10001:10001 --memory=512m --cpus=1 --pids-limit=256 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /downloads:ro,nosuid,noexec,size=16m -p 127.0.0.1:8787:8787 reelscarey:ci
          trap 'docker logs reelscarey-ci; docker rm -fv reelscarey-ci' EXIT
          node scripts/container-smoke.mjs
          docker stats --no-stream --format 'Container resources: {{.MemUsage}}, {{.CPUPerc}}, {{.PIDs}}' reelscarey-ci
      - name: Container metadata update and rollback
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name reelscarey-meta-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true -e REELSCAREY_PUBLIC_URL=http://127.0.0.1:18788 -p 127.0.0.1:18788:8787 reelscarey:ci
          trap 'docker logs reelscarey-meta-ci; docker rm -fv reelscarey-meta-ci' EXIT
          REELSCAREY_SMOKE_URL=http://127.0.0.1:18788 REELSCAREY_SMOKE_CONTAINER=reelscarey-meta-ci node scripts/container-metadata-smoke.mjs
      - name: Container backup, upload, restore and recovery
        run: bash scripts/backup-container-smoke.sh reelscarey:ci
      - name: Container feature schedules, subtitle edits and reviewed bulk operations
        run: bash scripts/seven-feature-container-smoke.sh reelscarey:ci
      - name: Automatic existing-library matching and retained generated media
        run: bash scripts/automatic-library-container-smoke.sh reelscarey:ci
      - name: Container storage copy, mount activation and recovery
        run: bash scripts/storage-container-smoke.sh reelscarey:ci
      - name: Constrained container read and write budget
        run: bash scripts/container-workload.sh reelscarey:ci 60

  # RS-0015 remainder: a real Windows smoke. The hosted Windows runner builds
  # the binary natively, validates the CLI/config-path behavior on Windows
  # path semantics, and runs the same smoke script the Linux fast job runs.
  # Route-level API coverage rides along through the smoke script's
  # authenticated endpoint checks; the full test suite stays on Linux.
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the embedded frontend
        # web/embed.go declares //go:embed all:dist and web/dist/ is
        # gitignored; cmd/reelscarey embeds it, so the binary build below
        # fails with "pattern all:dist: no matching files found" until the
        # frontend is built.
        run: npm ci && npm run build
        working-directory: web
      - name: Build the Windows binary
        run: go build -o bin/reelscarey.exe ./cmd/reelscarey
      - name: Route-level package tests on Windows path semantics
        run: go test ./internal/httpapi ./internal/storage ./internal/backups -count=1 -timeout=15m
      - name: Install FFmpeg for the system-check smoke
        # The smoke asserts every system check is green; the video-inspection
        # check requires ffprobe, which hosted Windows runners do not
        # preinstall (observed on run 43568253847).
        run: choco install ffmpeg -y --no-progress
      - name: Windows startup and route smoke
        run: node scripts/smoke.mjs

  # Phase 5: browser E2E on the real backend (built frontend embedded in the
  # binary) driving the setup, returning-user, library, settings and
  # destructive-action journeys. Report-only until the first green run, so a
  # harness/environment issue cannot block pushes.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
