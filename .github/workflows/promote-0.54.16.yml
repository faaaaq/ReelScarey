name: Promote verified ReelScarey v0.54.16
on:
  push:
    branches: [codex/promote-reelscarey-0.54.16]
    paths: [.github/workflows/promote-0.54.16.yml]

permissions: {}

concurrency:
  group: dockerhub-primary
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/codex/promote-reelscarey-0.54.16' && github.repository == 'faaaaq/ReelScarey'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify and promote the published image index
        shell: bash
        env:
          IMAGE: docker.io/faaaaq/reelscarey
          SOURCE_TAG: sha-d39ae65fa965aa338428e85fa4fecadc9a5d406b
          EXPECTED: sha256:247cc17d4e23588f63692d389ccb3f1b9d1666b64b4ce68dd15f5e398653630e
          PREVIOUS: sha256:d192e22097612a09fb1d82657003a11a3f103c18a8e8bafece4cf9cc35121e6d
        run: |
          set -euo pipefail
          digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }

          target=$(digest "$IMAGE:$SOURCE_TAG")
          if [[ "$target" != "$EXPECTED" ]]; then
            echo "::error::The candidate tag resolves to $target, expected $EXPECTED."
            exit 1
          fi

          current=$(digest "$IMAGE:latest")
          printf 'Previous latest: %s\n' "$current"
          if [[ "$current" != "$EXPECTED" ]]; then
            if [[ "$current" != "$PREVIOUS" ]]; then
              echo "::error::Latest moved since v0.54.15. Refusing to overwrite $current."
              exit 1
            fi
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$EXPECTED"
          fi

          actual=$(digest "$IMAGE:latest")
          test "$actual" = "$EXPECTED"
          printf 'Verified %s:latest @ %s\n' "$IMAGE" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"
