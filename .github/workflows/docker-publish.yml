name: Publish ReelScarey to Docker Hub

on:
  push:
    branches:
      - codex/foundation
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: dockerhub-primary
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read application version
        id: version
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("web/package.json","utf8")).version; if(!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${v}\n`);'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: reelscarey:release-test
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: false
          sbom: false

      - name: Verify release startup, backup restore and storage recovery
        run: |
          bash scripts/server-compose-smoke.sh reelscarey:release-test
          bash scripts/backup-container-smoke.sh reelscarey:release-test
          bash scripts/seven-feature-container-smoke.sh reelscarey:release-test
          bash scripts/storage-container-smoke.sh reelscarey:release-test

      - name: Build and push ReelScarey
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/reelscarey:latest
            ${{ vars.DOCKERHUB_USERNAME }}/reelscarey:${{ steps.version.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/reelscarey:sha-${{ github.sha }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Pull and verify the published image
        env:
          RELEASE_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/reelscarey@${{ steps.build.outputs.digest }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          docker pull "$RELEASE_IMAGE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RELEASE_IMAGE")" = "$RELEASE_REVISION"
          bash scripts/backup-container-smoke.sh "$RELEASE_IMAGE"
          printf 'Verified published image: `%s`\n' "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      # Private repositories require Enterprise Cloud for GitHub attestations.
      - name: Sign container build provenance
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/reelscarey
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record private-repository signing limitation
        if: github.event.repository.private && vars.ENABLE_PRIVATE_ATTESTATIONS != 'true'
        run: echo 'Image has BuildKit provenance and an SBOM. Signed GitHub attestation is pending public release or confirmed Enterprise Cloud eligibility.' >> "$GITHUB_STEP_SUMMARY"