# Ubuntu x86-64 server installation: no source build required.
services:
  reelscarey:
    image: ${REELSCAREY_IMAGE:-faaaaq/reelscarey:0.34.1}
    platform: linux/amd64
    user: '10001:10001'
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    pids_limit: 256
    ports:
      - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_PORT:-8787}:8787"
      # Optional inbound peer port for the built-in qBittorrent client. Choose a
      # free host port and uncomment both entries; outbound torrents work
      # without this; do not reuse a port already bound by another client.
      # - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_QBT_PORT:-6881}:6881/tcp"
      # - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_QBT_PORT:-6881}:6881/udp"
    environment:
      REELSCAREY_PUBLIC_URL: ${REELSCAREY_PUBLIC_URL:?Set the exact browser URL in server.env}
      REELSCAREY_LOG_LEVEL: info
    # Optional VPN support for the built-in torrent client: uncomment the
    # capability together with REELSCAREY_KEEP_NET_ADMIN=1 in server.env. The
    # tunnel only carries torrent traffic the client binds to it.
    # cap_add:
    #   - NET_ADMIN
    volumes:
      - config:/config
      - type: bind
        source: ${MEDIA_PATH:?Set an existing test media folder in server.env}
        target: /media
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_PATH:?Set an existing download folder in server.env}
        target: /downloads
        read_only: ${DOWNLOADS_READ_ONLY:-true}
        bind:
          create_host_path: false
      - youtube_staging:/youtube-staging
      - backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
volumes:
  config:
  youtube_staging:
  backups: