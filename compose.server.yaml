# Ubuntu x86-64 server installation: no source build required.
services:
  reelscarey:
    image: ${REELSCAREY_IMAGE:-faaaaq/reelscarey:0.29.3}
    platform: linux/amd64
    user: '10001:10001'
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    pids_limit: 256
    ports:
      - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_PORT:-8787}:8787"
    environment:
      REELSCAREY_PUBLIC_URL: ${REELSCAREY_PUBLIC_URL:?Set the exact browser URL in server.env}
      REELSCAREY_LOG_LEVEL: info
    volumes:
      - config:/config
      - type: bind
        source: ${MEDIA_PATH:?Set an existing test media folder in server.env}
        target: /media
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_PATH:?Set an existing download folder in server.env}
        target: /downloads
        read_only: true
        bind:
          create_host_path: false
      - youtube_staging:/youtube-staging
      - backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
volumes:
  config:
  youtube_staging:
  backups: