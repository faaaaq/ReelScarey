services:
  reelscarey:
    build:
      context: .
      args:
        VERSION: ${REELSCAREY_VERSION:-0.32.0-dev}
    image: reelscarey:local
    user: '10001:10001'
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    pids_limit: 256
    ports:
      - "127.0.0.1:${REELSCAREY_PORT:-8787}:8787"
    environment:
      REELSCAREY_LISTEN_ADDR: 0.0.0.0:8787
      REELSCAREY_CONFIG_DIR: /config
      REELSCAREY_MEDIA_DIR: /media
      REELSCAREY_DOWNLOADS_DIR: /downloads
      REELSCAREY_BACKUPS_DIR: /backups
      REELSCAREY_YOUTUBE_STAGING_DIR: /youtube-staging/work
      REELSCAREY_LOG_LEVEL: ${REELSCAREY_LOG_LEVEL:-info}
      REELSCAREY_BROWSE_ROOTS: ${REELSCAREY_BROWSE_ROOTS:-}
      REELSCAREY_PUBLIC_URL: ${REELSCAREY_PUBLIC_URL:-}
    volumes:
      - reelscarey_config:/config
      - ${MEDIA_PATH:-./media}:/media:rw
      - ${DOWNLOADS_PATH:-./downloads}:/downloads:ro
      - reelscarey_youtube_staging:/youtube-staging
      - reelscarey_backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

volumes:
  reelscarey_config:
  reelscarey_youtube_staging:
  reelscarey_backups:
