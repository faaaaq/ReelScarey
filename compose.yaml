services:
  reelscarey:
    build:
      context: .
      args:
        VERSION: ${REELSCAREY_VERSION:-0.52.1-dev}
    image: reelscarey:local
    user: '10001:10001'
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    pids_limit: 256
    ports:
      - "127.0.0.1:${REELSCAREY_PORT:-8787}:8787"
    environment:
      REELSCAREY_LISTEN_ADDR: 0.0.0.0:8787
      REELSCAREY_CONFIG_DIR: /config
      # These two mounts are separate and /downloads is read-only, so imports
      # use a verified copy. For hardlink imports, mount ONE writable parent
      # (for example ${DATA_PATH:-./data}:/data) and set these roots to
      # /data/media and /data/downloads. The first-run setup asks whether to
      # prefer hardlinks or always copy; Settings -> General can change it.
      REELSCAREY_MEDIA_DIR: /media
      REELSCAREY_DOWNLOADS_DIR: /downloads
      REELSCAREY_BACKUPS_DIR: /backups
      REELSCAREY_YOUTUBE_STAGING_DIR: /youtube-staging/work
      REELSCAREY_LOG_LEVEL: ${REELSCAREY_LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      REELSCAREY_BROWSE_ROOTS: ${REELSCAREY_BROWSE_ROOTS:-}
      REELSCAREY_PUBLIC_URL: ${REELSCAREY_PUBLIC_URL:-}
    volumes:
      - reelscarey_config:/config
      # Separate read-write/read-only mounts disable the download-to-library
      # hardlink path because it requires one writable mounted filesystem.
      # Keep this safe default, or replace both entries with a single parent:
      #   - ${DATA_PATH:-./data}:/data
      # and use /data/media and /data/downloads above.
      - ${MEDIA_PATH:-./media}:/media:rw
      - ${DOWNLOADS_PATH:-./downloads}:/downloads:ro
      - reelscarey_youtube_staging:/youtube-staging
      - reelscarey_backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

volumes:
  reelscarey_config:
  reelscarey_youtube_staging:
  reelscarey_backups:
