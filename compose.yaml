# ReelScarey - one service, three folders.
#
# Point these three mounts at your host folders and ReelScarey needs nothing
# else configured:
#
#   ./config     -> /config     database + encryption key        (private, writable)
#   ./media      -> /media      your library                     (writable for imports)
#   ./downloads  -> /downloads  download client's finished files (writable only
#                               inside ReelScarey's own builtin folders)
#
# Using only an external download client? Add `:ro` to the /downloads line to
# make the whole folder read-only and guarantee seeding sources are untouched.
#
# Backups and YouTube review staging live in private Docker volumes below.
# The container paths are fixed; you never set a path in the environment unless
# your library or download folder must appear at a different path inside the
# container (see "Changing the container paths" in README.md).
#
# Before starting, set REELSCAREY_PUBLIC_URL to the exact address you open in a
# browser (required unless you browse from the server itself, localhost), then
# run:  docker compose up -d
services:
  reelscarey:
    image: ${REELSCAREY_IMAGE:-faaaaq/reelscarey:latest}
    # Developers can build this checkout instead of pulling the image:
    #   docker build -t reelscarey:local . && REELSCAREY_IMAGE=reelscarey:local docker compose up -d
    # (Separate step: `up -d` only ever uses an image that already exists.)
    container_name: ${REELSCAREY_CONTAINER_NAME:-reelscarey}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    pids_limit: 256
    ports:
      - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_PORT:-8787}:8787"
      # Optional inbound peer port for the built-in qBittorrent client. Choose a
      # free host port and uncomment both entries; outbound torrents work
      # without this.
      # - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_QBT_PORT:-6881}:6881/tcp"
      # - "${REELSCAREY_BIND_IP:-127.0.0.1}:${REELSCAREY_QBT_PORT:-6881}:6881/udp"
    environment:
      # Required unless you browse from the server itself (localhost): the exact
      # browser address (no trailing path).
      REELSCAREY_PUBLIC_URL: ${REELSCAREY_PUBLIC_URL:-}
      REELSCAREY_LOG_LEVEL: ${REELSCAREY_LOG_LEVEL:-info}
      # Optional shared TMDb Read Access Token (see README.md). Leave unset to
      # require each administrator to save a token in Settings.
      REELSCAREY_TMDB_TOKEN: ${REELSCAREY_TMDB_TOKEN:-}
      # Optional extra read-only file-browser roots as a JSON object
      # (see README.md).
      REELSCAREY_BROWSE_ROOTS: ${REELSCAREY_BROWSE_ROOTS:-}
      # Linux account that owns the library and the private folders below.
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      TZ: ${TZ:-UTC}
      # Optional VPN support for the built-in torrent client: uncomment
      # cap_add NET_ADMIN below and set REELSCAREY_KEEP_NET_ADMIN=1. The tunnel
      # carries only torrent traffic the client binds to it.
      # REELSCAREY_KEEP_NET_ADMIN: "1"
      # Optional extra read-only folders for the file browser (JSON object).
      # REELSCAREY_BROWSE_ROOTS: '{"youtube":"/youtube"}'
    volumes:
      - ${MEDIA_PATH:-./media}:/media
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ${CONFIG_PATH:-./config}:/config
      - backups:/backups
      - youtube_staging:/youtube-staging
      # Hardlink imports need ONE writable filesystem containing both folders.
      # Keep the separate mounts above for verified copies, or replace them
      # with a single parent and read "Hardlink imports" in README.md.
      # - ${DATA_PATH:-./data}:/data
      # Optional extra library or music roots (any number, read-only or not).
      # - /mnt/movies:/media/movies
      # - /mnt/tv:/media/tvshows
    security_opt:
      # Prevents any process from gaining privileges it did not already have.
      - no-new-privileges:true
    # NOTE: do NOT add `cap_drop: [ALL]`. Startup briefly runs as root to chown
    # the three folders to PUID/PGID and then drops to that account; removing
    # root's own capabilities makes that ownership fix fail and the container
    # exits (chmod/chown "Operation not permitted"). no-new-privileges plus a
    # read-only root filesystem below is the intended hardening.
    # cap_add:
    #   - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

volumes:
  backups:
  youtube_staging:
